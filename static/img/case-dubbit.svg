<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Dubbit speech pipeline</title>
  <desc id="desc">Abstract diagram of a video dubbing pipeline from speech recognition through translation and voice synthesis to final mix.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111319"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00a3ff"/>
      <stop offset="1" stop-color="#ff124a"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".045"/>
    </pattern>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>
  <rect width="960" height="540" fill="url(#grid)"/>
  <circle cx="876" cy="68" r="92" fill="#ff124a" opacity=".08"/>
  <circle cx="84" cy="474" r="132" fill="#0088cc" opacity=".08"/>

  <text x="54" y="72" fill="#fff" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="2">DUBBIT</text>
  <text x="54" y="105" fill="#fff" fill-opacity=".52" font-family="Arial, sans-serif" font-size="15" letter-spacing="2">MULTILINGUAL SPEECH PIPELINE</text>

  <g transform="translate(54 164)">
    <rect width="852" height="216" rx="24" fill="#fff" fill-opacity=".035" stroke="#fff" stroke-opacity=".13"/>
    <path d="M86 108H766" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>

    <g font-family="Arial, sans-serif" text-anchor="middle">
      <g transform="translate(86 108)">
        <circle r="38" fill="#12151c" stroke="#fff" stroke-opacity=".24"/>
        <path d="M-8-14 15 0-8 14Z" fill="#fff"/>
        <text y="70" fill="#fff" fill-opacity=".58" font-size="14" letter-spacing="1">VIDEO</text>
      </g>

      <g transform="translate(256 108)">
        <circle r="38" fill="#12151c" stroke="#00a3ff" stroke-width="2"/>
        <path d="M-15 0h5m5-12v24M5-20v40m10-12V8" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
        <text y="70" fill="#fff" fill-opacity=".8" font-size="14" font-weight="700" letter-spacing="1">ASR</text>
      </g>

      <g transform="translate(426 108)">
        <circle r="38" fill="#12151c" stroke="#5e77ff" stroke-width="2"/>
        <path d="M-17-8h34M-17 2h22M-17 12h29" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
        <text y="70" fill="#fff" fill-opacity=".8" font-size="14" font-weight="700" letter-spacing="1">TRANSLATE</text>
      </g>

      <g transform="translate(596 108)">
        <circle r="38" fill="#12151c" stroke="#bf3cff" stroke-width="2"/>
        <path d="M-18 1c8-24 8 24 18 0s10 24 20 0" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
        <text y="70" fill="#fff" fill-opacity=".8" font-size="14" font-weight="700" letter-spacing="1">TTS</text>
      </g>

      <g transform="translate(766 108)">
        <circle r="38" fill="#12151c" stroke="#ff124a" stroke-width="2"/>
        <path d="M-17-10h34M-11 0h22M-5 10H5" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
        <text y="70" fill="#fff" fill-opacity=".8" font-size="14" font-weight="700" letter-spacing="1">FINAL MIX</text>
      </g>
    </g>
  </g>

  <g transform="translate(54 426)" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1">
    <rect width="134" height="42" rx="21" fill="#fff" fill-opacity=".055" stroke="#fff" stroke-opacity=".12"/>
    <text x="67" y="26" text-anchor="middle" fill="#fff" fill-opacity=".72">WHISPERX</text>
    <rect x="146" width="118" height="42" rx="21" fill="#fff" fill-opacity=".055" stroke="#fff" stroke-opacity=".12"/>
    <text x="205" y="26" text-anchor="middle" fill="#fff" fill-opacity=".72">VOICE ID</text>
    <rect x="276" width="106" height="42" rx="21" fill="#fff" fill-opacity=".055" stroke="#fff" stroke-opacity=".12"/>
    <text x="329" y="26" text-anchor="middle" fill="#fff" fill-opacity=".72">TIMING</text>
    <rect x="394" width="100" height="42" rx="21" fill="#fff" fill-opacity=".055" stroke="#fff" stroke-opacity=".12"/>
    <text x="444" y="26" text-anchor="middle" fill="#fff" fill-opacity=".72">FFMPEG</text>
  </g>
</svg>
